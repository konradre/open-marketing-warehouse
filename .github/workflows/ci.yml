name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy omw

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Start ClickHouse and mcp-clickhouse
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait clickhouse mcp-clickhouse

      - name: Integration tests
        env:
          OMW_REQUIRE_CLICKHOUSE: "1"
        run: uv run pytest tests/integration

      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color clickhouse mcp-clickhouse

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v
