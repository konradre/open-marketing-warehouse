name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy omw

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Start ClickHouse and mcp-clickhouse
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait clickhouse mcp-clickhouse

      - name: Integration tests
        env:
          OMW_REQUIRE_CLICKHOUSE: "1"
        run: uv run pytest tests/integration

      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color clickhouse mcp-clickhouse

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  profiles:
    # The optional compose profiles (LibreChat, Langfuse) boot with throwaway secrets and must answer over
    # HTTP. Independent of the gate so a slow image pull never delays it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Throwaway secrets
        run: deploy/profiles-env.sh .env

      - name: Boot the chat and observability profiles
        run: deploy/profiles-smoke.sh .env

      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile chat --profile observability logs --no-color --tail 200

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile chat --profile observability down -v
