source: linkedin_ads
reports:
  - name: campaigns
    view: marts.linkedin_ads_campaigns
    description: LinkedIn Ads campaign daily analytics, one row per sponsored account, campaign and day.
    dimensions:
      account_id: LinkedIn sponsored account id
      currency: ISO 4217 currency of the sponsored account; cost is in it
      campaign_id: LinkedIn campaign id
      campaign_name: Campaign name at the last entity pull, empty when no longer listed
    campaign_key: "concat('linkedin_ads:', campaign_id)"
    restatement_days: 7
    traps:
      - LinkedIn settles cost and conversions over a few days; the last 7 days are re-pulled and may change.
  - name: creatives
    view: marts.linkedin_ads_creatives
    description: LinkedIn Ads creative daily analytics, one row per sponsored account, creative and day.
    dimensions:
      account_id: LinkedIn sponsored account id
      currency: ISO 4217 currency of the sponsored account
      campaign_id: LinkedIn campaign the creative belongs to, empty when no longer listed
      campaign_name: Campaign name at the last entity pull
      creative_id: LinkedIn creative id
      creative_status: Intended status at the last entity pull
      is_serving: Whether the creative was serving at the last entity pull
    campaign_key: "concat('linkedin_ads:', campaign_id)"
    restatement_days: 7
    traps:
      - Sums to the campaigns grain on cost, impressions and clicks.
  - name: leads
    view: marts.linkedin_ads_leads
    description: LinkedIn lead-gen form responses, one row per lead, dated by submission day.
    dimensions:
      account_id: LinkedIn sponsored account id
      currency: ISO 4217 currency of the sponsored account
      campaign_id: LinkedIn campaign the lead came from
      campaign_name: Campaign name at the last entity pull
      creative_id: LinkedIn creative the lead came from
      form_id: Lead gen form id
      lead_type: SPONSORED or ORGANIC
    campaign_key: "concat('linkedin_ads:', campaign_id)"
    traps:
      - Only loaded with --leads (needs r_marketing_leadgen_automation).
metrics:
  - name: linkedin_spend
    report: campaigns
    expr: sum(cost)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [spend, cost, ad_spend_linkedin]
    description: Amount spent on LinkedIn Ads, in the account currency.
  - name: linkedin_impressions
    report: campaigns
    expr: sum(impressions)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [impressions]
    description: Times a LinkedIn ad was shown.
  - name: linkedin_clicks
    report: campaigns
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [clicks]
    description: Chargeable clicks on LinkedIn ads.
  - name: linkedin_conversions
    report: campaigns
    expr: sum(conversions)
    unit: events
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [conversions]
    description: Website conversions attributed by the LinkedIn Insight Tag, post-click and post-view.
  - name: linkedin_cpc
    report: campaigns
    expr: sum(cost) / nullIf(sum(clicks), 0)
    unit: currency
    aggregation: rate
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [cpc]
    description: LinkedIn cost per click, recomputed at the requested grain.
  - name: linkedin_creative_spend
    report: creatives
    expr: sum(cost)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, creative_id, creative_status, is_serving, campaign_key]
    description: LinkedIn spend per creative, in the account currency.
  - name: linkedin_creative_clicks
    report: creatives
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, creative_id, creative_status, is_serving, campaign_key]
    description: Chargeable clicks per LinkedIn creative.
  - name: linkedin_creative_conversions
    report: creatives
    expr: sum(conversions)
    unit: events
    grains: [account_id, currency, campaign_id, campaign_name, creative_id, creative_status, is_serving, campaign_key]
    description: Insight Tag conversions per LinkedIn creative.
  - name: linkedin_leads
    report: leads
    expr: count()
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, creative_id, form_id, lead_type, campaign_key]
    aliases: [leads]
    description: Lead-gen form responses on LinkedIn, by submission day.
