derived:
  - name: ad_spend
    derived: meta_spend + google_spend + linkedin_spend
    unit: currency
    requires_common_grain: [date, campaign_key, currency]
    aliases: [total_spend, paid_media_spend]
    description: Meta plus Google Ads plus LinkedIn Ads spend. Only comparable within one currency.
  - name: roas
    derived: revenue / ad_spend
    unit: ratio
    requires_common_grain: [date, campaign_key, currency]
    description: Stripe paid revenue divided by ad spend, each aggregated to the common grain first.
  - name: cac
    derived: ad_spend / new_customers
    unit: currency
    requires_common_grain: [date, campaign_key, currency]
    description: Ad spend per new paying customer, each aggregated to the common grain first.
  - name: pipeline_cac
    derived: ad_spend / opportunities
    unit: currency
    requires_common_grain: [date, campaign_key, currency]
    aliases: [cost_per_opportunity]
    description: Ad spend per CRM opportunity created, each aggregated to the common grain first.
  - name: blended_cpc
    derived: ad_spend / (meta_clicks + google_clicks + linkedin_clicks)
    unit: currency
    requires_common_grain: [date, campaign_key, currency]
    description: Ad spend per click across Meta, Google and LinkedIn.
  - name: cost_per_lead
    derived: ad_spend / (meta_leads + linkedin_leads)
    unit: currency
    requires_common_grain: [date, campaign_key, currency]
    aliases: [cpl]
    description: Ad spend per lead-ad submission across Meta and LinkedIn, each aggregated to the common grain first.
