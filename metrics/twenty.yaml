source: twenty
reports:
  - name: opportunities
    view: marts.twenty_pipeline
    description: Twenty CRM sales pipeline, one row per opportunity, dated by the day it was created.
    row_level: true
    dimensions:
      stage: Pipeline stage as configured in Twenty (NEW, SCREENING, MEETING, PROPOSAL, CUSTOMER by default)
      is_won: True when the stage is a closed-won stage of the deployment (CUSTOMER unless configured otherwise)
      currency: ISO 4217 currency of the amount, empty when unset
      company_id: Twenty company id, empty when none
      company_name: Company name at the last sync
      utm_source: utm_source attribution, opportunity then contact then company; empty when absent
      utm_medium: utm_medium attribution, same precedence
      utm_campaign: utm_campaign attribution, same precedence
      attributed: True when any attribution field is set
    campaign_key: campaign_key
    traps:
      - Opportunities are dated by creation day and reflect their current stage and amount, so past days change as deals move.
      - Stage names are the Twenty configuration. Which stages count as won is configured in the pipeline (is_won); CUSTOMER by default.
  - name: activity
    view: marts.twenty_activity
    description: Twenty CRM notes and tasks, one row per activity and attached record, dated by creation day.
    row_level: true
    dimensions:
      kind: note or task
      status: Task status (TODO, IN_PROGRESS, DONE as configured), empty for notes
      created_by: Workspace member or system that created it
      person_id: Attached person id, empty when none
      company_id: Attached company id, else the attached opportunity's company
      company_name: Company name at the last sync
      opportunity_id: Attached opportunity id, empty when none
      opportunity_name: Opportunity name at the last sync
    campaign_key: campaign_key
    traps:
      - A note or task attached to several records is one row per record; the counts here are distinct activities.
  - name: timeline
    view: marts.twenty_timeline
    description: Twenty CRM change feed, one row per event Twenty recorded on a record, dated by the day it happened.
    row_level: true
    dimensions:
      event: Event name as Twenty records it (opportunity.updated, linked-note.created)
      object: Kind of record the event is about (opportunity, person, company, note, task)
      action: created, updated, deleted, restored, linked or unlinked
      is_linked: True when the event is about a note or task linked to the record
      stage_before: Stage an opportunity left, empty when the event did not change its stage
      stage_after: Stage an opportunity entered, empty when the event did not change its stage
      member_id: Workspace member who caused the event, empty for the system or an API key
      person_id: Person the event happened on, empty when none
      company_id: Company the event happened on, else the company of its opportunity
      company_name: Company name at the last sync
      opportunity_id: Opportunity the event happened on, empty when none
      opportunity_name: Opportunity name at the last sync
    campaign_key: campaign_key
    traps:
      - Twenty may fold quick successive edits of one record by one member into a single event, so events undercount edits.
      - An opportunity created directly in a closed-won stage has no stage move; crm_wins misses it and won_opportunities counts it.
      - The feed starts when the record was first synced with timeline activities on; older moves are only there if Twenty kept them.
metrics:
  - name: opportunities
    report: opportunities
    expr: count()
    unit: count
    grains: [stage, is_won, currency, company_id, company_name, utm_source, utm_medium, utm_campaign, attributed, campaign_key]
    aliases: [deals, pipeline_count]
    description: Opportunities created, whatever their stage today.
  - name: pipeline_amount
    report: opportunities
    expr: sum(amount)
    unit: currency
    grains: [stage, is_won, currency, company_id, company_name, utm_source, utm_medium, utm_campaign, attributed, campaign_key]
    aliases: [pipeline, pipeline_value]
    description: Sum of opportunity amounts in their currency, by creation day.
  - name: won_opportunities
    report: opportunities
    expr: countIf(is_won)
    unit: count
    grains: [currency, company_id, company_name, utm_source, utm_medium, utm_campaign, attributed, campaign_key]
    aliases: [closed_won, won_deals]
    description: Opportunities now in a closed-won stage (is_won; CUSTOMER unless configured), counted on their creation day.
  - name: won_amount
    report: opportunities
    expr: sumIf(amount, is_won)
    unit: currency
    grains: [currency, company_id, company_name, utm_source, utm_medium, utm_campaign, attributed, campaign_key]
    aliases: [closed_won_amount]
    description: Amount of the opportunities now in a closed-won stage (is_won; CUSTOMER unless configured), by creation day.
  - name: crm_activities
    report: activity
    expr: uniqExact(activity_id)
    unit: count
    aggregation: distinct
    grains: [kind, status, created_by, person_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [activities]
    description: Distinct notes and tasks created, by creation day, recounted at the requested grain. Rows do not add up.
  - name: crm_notes
    report: activity
    expr: uniqExactIf(activity_id, kind = 'note')
    unit: count
    aggregation: distinct
    grains: [kind, status, created_by, person_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [notes]
    description: Distinct notes created, by creation day.
  - name: crm_tasks
    report: activity
    expr: uniqExactIf(activity_id, kind = 'task')
    unit: count
    aggregation: distinct
    grains: [kind, status, created_by, person_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [tasks]
    description: Distinct tasks created, by creation day; filter status for open ones.
  - name: crm_events
    report: timeline
    expr: count()
    unit: count
    grains: [event, object, action, is_linked, stage_before, stage_after, member_id, person_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [timeline_events]
    description: Events in Twenty's change feed (records created, updated, deleted, notes and tasks linked), by the day they happened.
  - name: crm_stage_changes
    report: timeline
    expr: countIf(stage_after != '')
    unit: count
    grains: [stage_before, stage_after, member_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [stage_changes, stage_moves]
    description: Opportunity stage moves, by the day the opportunity moved; split by stage_before and stage_after.
  - name: crm_wins
    report: timeline
    expr: countIf(became_won)
    unit: count
    grains: [stage_before, member_id, company_id, company_name, opportunity_id, opportunity_name, campaign_key]
    aliases: [wins, deals_won]
    description: Moves of an opportunity into a closed-won stage (CUSTOMER unless configured), by the day it moved. won_opportunities counts by creation day instead.
