source: meta_ads
reports:
  - name: campaigns
    view: marts.meta_ads_campaigns
    description: Meta Ads campaign-level insights, one row per account, campaign and day.
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account; spend is in it
      campaign_id: Meta campaign id
      campaign_name: Campaign name at pull time
    campaign_key: "concat('meta_ads:', campaign_id)"
    restatement_days: 28
    traps:
      - Meta restates conversions and spend for up to 28 days; recent days change.
  - name: age_gender
    view: marts.meta_ads_age_gender
    description: Meta Ads campaign insights by age bracket and gender, one row per campaign, segment and day.
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account
      campaign_id: Meta campaign id
      campaign_name: Campaign name at pull time
      age: Age bracket (18-24, 25-34, ..., 65+, Unknown)
      gender: female, male or unknown
    campaign_key: "concat('meta_ads:', campaign_id)"
    restatement_days: 28
    traps:
      - Sums to the campaigns grain on spend, impressions and clicks; reach does not.
  - name: countries
    view: marts.meta_ads_countries
    description: Meta Ads campaign insights by country, one row per campaign, country and day.
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account
      campaign_id: Meta campaign id
      campaign_name: Campaign name at pull time
      country: ISO 3166-1 alpha-2 country of the people reached
    campaign_key: "concat('meta_ads:', campaign_id)"
    restatement_days: 28
    traps:
      - Sums to the campaigns grain on spend, impressions and clicks; reach does not.
  - name: placements
    view: marts.meta_ads_placements
    description: Meta Ads campaign insights by placement, one row per campaign, platform, position and day.
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account
      campaign_id: Meta campaign id
      campaign_name: Campaign name at pull time
      publisher_platform: facebook, instagram, audience_network or messenger
      platform_position: Position on the platform (feed, instagram_stories, instagram_reels, ...)
    campaign_key: "concat('meta_ads:', campaign_id)"
    restatement_days: 28
    traps:
      - Sums to the campaigns grain on spend, impressions and clicks; reach does not.
  - name: leads
    view: marts.meta_ads_leads
    description: Meta lead-ads submissions, one row per lead, dated by submission day.
    row_level: true
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account
      campaign_id: Meta campaign id
      campaign_name: Campaign name as reported on the lead
      adset_id: Meta ad set id
      adset_name: Ad set name as reported on the lead
      ad_id: Meta ad id
      ad_name: Ad name as reported on the lead
      form_id: Lead form id
      is_organic: True when the lead came from the organic form, not the ad
      platform: fb or ig
    campaign_key: "concat('meta_ads:', campaign_id)"
    traps:
      - Only loaded with --leads (needs leads_retrieval); organic leads cost nothing, filter is_organic for paid leads.
  - name: ads
    view: marts.meta_ads_ads
    description: Meta Ads ad-level insights, one row per account, ad and day, for ad sets active at pull time.
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account; spend is in it
      campaign_id: Meta campaign id
      campaign_name: Campaign name at pull time
      adset_id: Meta ad set id
      adset_name: Ad set name at pull time
      ad_id: Meta ad id
      ad_name: Ad name at pull time
    campaign_key: "concat('meta_ads:', campaign_id)"
    restatement_days: 28
    traps:
      - Only ads of ad sets that were active at pull time are pulled, so the ads grain can undercount campaigns; never add the two. An ad set paused since keeps the rows of its last pull, without Meta's later restatements.
  - name: campaign_list
    view: marts.meta_ads_campaign_list
    description: Meta campaigns as last synced, one row per campaign, with status, objective and budgets.
    row_level: true
    snapshot: true
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account, empty until insights were pulled
      campaign_id: Meta campaign id
      campaign_name: Campaign name at the last pull
      status: Configured status (ACTIVE, PAUSED, DELETED or ARCHIVED)
      effective_status: Status after account and schedule rules (ACTIVE, PAUSED, CAMPAIGN_PAUSED, ...)
      objective: Campaign objective, for example OUTCOME_SALES or OUTCOME_LEADS
      buying_type: AUCTION or RESERVED
    campaign_key: "concat('meta_ads:', campaign_id)"
    traps:
      - A campaign budget is 0 when the budget is set on its ad sets; see meta_ad_set_daily_budget.
  - name: ad_set_list
    view: marts.meta_ads_ad_set_list
    description: Meta ad sets as last synced, one row per ad set, with status, bidding and budgets.
    row_level: true
    snapshot: true
    dimensions:
      account_id: Meta ad account id (without act_)
      currency: ISO 4217 currency of the ad account, empty until insights were pulled
      campaign_id: Meta campaign the ad set belongs to
      campaign_name: Campaign name at the last pull
      adset_id: Meta ad set id
      adset_name: Ad set name at the last pull
      status: Configured status (ACTIVE, PAUSED, DELETED or ARCHIVED)
      effective_status: Status after campaign and schedule rules
      optimization_goal: What delivery optimises for, for example OFFSITE_CONVERSIONS or LINK_CLICKS
      billing_event: What is charged (IMPRESSIONS, LINK_CLICKS, ...)
      bid_strategy: LOWEST_COST_WITHOUT_CAP, LOWEST_COST_WITH_BID_CAP, COST_CAP, ...
    campaign_key: "concat('meta_ads:', campaign_id)"
    traps:
      - An ad set budget is 0 when the campaign budget applies; see meta_daily_budget.
metrics:
  - name: meta_spend
    report: campaigns
    expr: sum(spend)
    unit: currency
    aggregation: sum
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [spend, ad_spend_meta]
    description: Amount spent on Meta Ads, in the account currency.
  - name: meta_impressions
    report: campaigns
    expr: sum(impressions)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [impressions]
    description: Times a Meta ad was on screen.
  - name: meta_clicks
    report: campaigns
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [clicks]
    description: All clicks on Meta ads, not only link clicks.
  - name: meta_reach
    report: campaigns
    expr: sum(reach)
    unit: count
    aggregation: native
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [reach]
    description: "People reached per campaign and day. Not additive: a person counts once per row."
  - name: meta_cpc
    report: campaigns
    expr: sum(spend) / nullIf(sum(clicks), 0)
    unit: currency
    aggregation: rate
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [cpc]
    description: Meta cost per click, recomputed from spend and clicks at the requested grain.
  - name: meta_ctr
    report: campaigns
    expr: sum(clicks) / nullIf(sum(impressions), 0)
    unit: ratio
    aggregation: rate
    grains: [account_id, currency, campaign_id, campaign_name, campaign_key]
    aliases: [ctr]
    description: Meta click-through rate (0 to 1), recomputed at the requested grain.
  - name: meta_age_gender_spend
    report: age_gender
    expr: sum(spend)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, age, gender, campaign_key]
    description: Meta spend by age bracket and gender, in the account currency.
  - name: meta_age_gender_clicks
    report: age_gender
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, age, gender, campaign_key]
    description: Meta clicks by age bracket and gender.
  - name: meta_country_spend
    report: countries
    expr: sum(spend)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, country, campaign_key]
    description: Meta spend by country of the people reached, in the account currency.
  - name: meta_country_clicks
    report: countries
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, country, campaign_key]
    description: Meta clicks by country of the people reached.
  - name: meta_placement_spend
    report: placements
    expr: sum(spend)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, publisher_platform, platform_position, campaign_key]
    description: Meta spend by platform and position, in the account currency.
  - name: meta_placement_clicks
    report: placements
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, publisher_platform, platform_position, campaign_key]
    description: Meta clicks by platform and position.
  - name: meta_leads
    report: leads
    expr: count()
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, ad_id, ad_name, form_id, is_organic, platform, campaign_key]
    aliases: [leads]
    description: Lead-ads submissions on Meta, by submission day.
  - name: meta_ad_spend
    report: ads
    expr: sum(spend)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, ad_id, ad_name, campaign_key]
    description: Meta spend per ad, in the account currency, for ad sets active at pull time.
  - name: meta_ad_impressions
    report: ads
    expr: sum(impressions)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, ad_id, ad_name, campaign_key]
    description: Meta impressions per ad.
  - name: meta_ad_clicks
    report: ads
    expr: sum(clicks)
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, ad_id, ad_name, campaign_key]
    description: Meta clicks per ad (all clicks, not only link clicks).
  - name: meta_campaigns
    report: campaign_list
    expr: count()
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, status, effective_status, objective, buying_type, campaign_key]
    aliases: [campaigns]
    description: Meta campaigns as last synced; filter status or effective_status for the live ones.
  - name: meta_daily_budget
    report: campaign_list
    expr: sum(daily_budget)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, status, effective_status, objective, buying_type, campaign_key]
    aliases: [daily_budget, budget]
    description: Daily budget set on Meta campaigns, in the account currency; 0 where the ad sets hold the budget.
  - name: meta_ad_sets
    report: ad_set_list
    expr: count()
    unit: count
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, status, effective_status, optimization_goal, billing_event, bid_strategy, campaign_key]
    aliases: [ad_sets]
    description: Meta ad sets as last synced; filter status or effective_status for the live ones.
  - name: meta_ad_set_daily_budget
    report: ad_set_list
    expr: sum(daily_budget)
    unit: currency
    grains: [account_id, currency, campaign_id, campaign_name, adset_id, adset_name, status, effective_status, optimization_goal, billing_event, bid_strategy, campaign_key]
    aliases: [daily_budget, budget]
    description: Daily budget set on Meta ad sets, in the account currency; 0 where the campaign holds the budget.
