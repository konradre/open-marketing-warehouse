source: google_ads
reports:
  - name: campaigns
    view: marts.google_ads_campaigns
    description: Google Ads campaign daily performance, one row per customer, campaign and day.
    dimensions:
      customer_id: Google Ads customer (account) id
      currency: ISO 4217 currency of the account; cost is in it
      campaign_id: Google Ads campaign id
      campaign_name: Campaign name at pull time
      channel_type: SEARCH, DISPLAY, SHOPPING, VIDEO, PERFORMANCE_MAX, ...
    campaign_key: "concat('google_ads:', campaign_id)"
    restatement_days: 30
    traps:
      - Google attributes conversions for up to 30 days after the click; recent conversions grow.
  - name: ad_groups
    view: marts.google_ads_ad_groups
    description: Google Ads ad group daily performance.
    dimensions:
      customer_id: Google Ads customer (account) id
      currency: ISO 4217 currency of the account
      campaign_id: Google Ads campaign id
      campaign_name: Campaign name at pull time
      ad_group_id: Google Ads ad group id
      ad_group_name: Ad group name at pull time
    campaign_key: "concat('google_ads:', campaign_id)"
    restatement_days: 30
  - name: search_terms
    view: marts.google_ads_search_terms
    description: Google Ads search term daily performance, one row per ad group, search term and day.
    dimensions:
      customer_id: Google Ads customer (account) id
      currency: ISO 4217 currency of the account
      campaign_id: Google Ads campaign id
      campaign_name: Campaign name at pull time
      ad_group_id: Google Ads ad group id
      ad_group_name: Ad group name at pull time
      search_term: The query a user typed that triggered the ad
      search_term_status: ADDED (a keyword), EXCLUDED (a negative), ADDED_EXCLUDED or NONE
    campaign_key: "concat('google_ads:', campaign_id)"
    restatement_days: 30
    traps:
      - Search terms undercount the campaigns grain; Google withholds low-volume terms.
  - name: asset_groups
    view: marts.google_ads_asset_groups
    description: Google Ads Performance Max asset group daily performance, one row per asset group and day.
    dimensions:
      customer_id: Google Ads customer (account) id
      currency: ISO 4217 currency of the account
      campaign_id: Google Ads campaign id (a PERFORMANCE_MAX campaign)
      campaign_name: Campaign name at pull time
      asset_group_id: Google Ads asset group id
      asset_group_name: Asset group name at pull time
      asset_group_status: ENABLED, PAUSED or REMOVED at pull time
    campaign_key: "concat('google_ads:', campaign_id)"
    restatement_days: 30
    traps:
      - Only PERFORMANCE_MAX campaigns have asset groups; the grain sums to those campaigns only.
metrics:
  - name: google_spend
    report: campaigns
    expr: sum(cost)
    unit: currency
    grains: [customer_id, currency, campaign_id, campaign_name, channel_type, campaign_key]
    aliases: [spend, cost, ad_spend_google]
    description: Amount spent on Google Ads, in the account currency.
  - name: google_impressions
    report: campaigns
    expr: sum(impressions)
    unit: count
    grains: [customer_id, currency, campaign_id, campaign_name, channel_type, campaign_key]
    aliases: [impressions]
    description: Times a Google ad was shown.
  - name: google_clicks
    report: campaigns
    expr: sum(clicks)
    unit: count
    grains: [customer_id, currency, campaign_id, campaign_name, channel_type, campaign_key]
    aliases: [clicks]
    description: Clicks on Google ads.
  - name: google_conversions
    report: campaigns
    expr: sum(conversions)
    unit: events
    grains: [customer_id, currency, campaign_id, campaign_name, channel_type, campaign_key]
    aliases: [conversions]
    description: Google Ads conversions as the account's conversion actions count them, fractional.
  - name: google_cpc
    report: campaigns
    expr: sum(cost) / nullIf(sum(clicks), 0)
    unit: currency
    aggregation: rate
    grains: [customer_id, currency, campaign_id, campaign_name, channel_type, campaign_key]
    aliases: [cpc]
    description: Google cost per click, recomputed at the requested grain.
  - name: google_ad_group_spend
    report: ad_groups
    expr: sum(cost)
    unit: currency
    grains: [customer_id, currency, campaign_id, campaign_name, ad_group_id, ad_group_name, campaign_key]
    description: Google Ads spend at ad group grain.
  - name: google_search_term_clicks
    report: search_terms
    expr: sum(clicks)
    unit: count
    grains: [customer_id, currency, campaign_id, campaign_name, ad_group_id, ad_group_name, search_term, search_term_status, campaign_key]
    description: Clicks per search term. Sums to less than google_clicks because low-volume terms are withheld.
  - name: google_search_term_spend
    report: search_terms
    expr: sum(cost)
    unit: currency
    grains: [customer_id, currency, campaign_id, campaign_name, ad_group_id, ad_group_name, search_term, search_term_status, campaign_key]
    description: Google Ads spend per search term, in the account currency.
  - name: google_search_term_conversions
    report: search_terms
    expr: sum(conversions)
    unit: events
    grains: [customer_id, currency, campaign_id, campaign_name, ad_group_id, ad_group_name, search_term, search_term_status, campaign_key]
    description: Conversions per search term, fractional with modelled attribution.
  - name: google_asset_group_spend
    report: asset_groups
    expr: sum(cost)
    unit: currency
    grains: [customer_id, currency, campaign_id, campaign_name, asset_group_id, asset_group_name, asset_group_status, campaign_key]
    description: Performance Max spend per asset group, in the account currency.
  - name: google_asset_group_clicks
    report: asset_groups
    expr: sum(clicks)
    unit: count
    grains: [customer_id, currency, campaign_id, campaign_name, asset_group_id, asset_group_name, asset_group_status, campaign_key]
    description: Clicks per Performance Max asset group.
  - name: google_asset_group_conversions
    report: asset_groups
    expr: sum(conversions)
    unit: events
    grains: [customer_id, currency, campaign_id, campaign_name, asset_group_id, asset_group_name, asset_group_status, campaign_key]
    description: Conversions per Performance Max asset group, fractional with modelled attribution.
