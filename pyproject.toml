[project]
name = "open-marketing-warehouse"
version = "0.1.0"
description = "An open-source data layer for marketing agents: scheduled pipelines, a ClickHouse warehouse and a read-only path for the agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt[clickhouse]>=1.0",
    "clickhouse-connect>=0.8",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "google-auth>=2.62.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
    "responses>=0.26.3",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omw"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
files = ["omw", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "dlt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs ClickHouse (and mcp-clickhouse) from deploy/docker-compose.yml",
]
addopts = "-ra"
