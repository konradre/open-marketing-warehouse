# Non-secret dlt configuration (committed). Secrets live in .dlt/secrets.toml (never committed).

[runtime]
# No anonymous usage pings to dltHub from pipelines or tests.
dlthub_telemetry = false
log_level = "WARNING"

[sources.search_console]
# Defaults; override in secrets.toml next to the credentials.
search_types = ["web"]
data_state = "all"

[sources.meta_ads]
levels = ["campaign"]

[sources.ga4]
days = 7

[sources.stripe]
invoice_window_days = 90

[checks.freshness_hours]
# Budget per source in hours; `omw check` fails freshness when the last successful sync is older.
search_console = 48
meta_ads = 30
google_ads = 30
ga4 = 30
stripe = 30
linkedin_ads = 30
twenty = 30

[sources.linkedin_ads]
days = 7

[sources.twenty]
# Stages that count as closed-won (is_won in marts.twenty_pipeline; the won_* metrics). Twenty's default.
won_stages = ["CUSTOMER"]
# Stages that count as closed-lost (is_lost). Twenty's default pipeline has none; name yours, for example ["LOST"].
lost_stages = []
# Twenty's change feed (timeline activities -> marts.twenty_timeline). It grows with every edit; false leaves it out.
timeline = true

[checks]
# Days ahead of a recorded credential end date (sources.<source>.token_expires_at) the expiry check warns.
expiry_warn_days = 14

[schedule]
# When each job runs, in UTC: "HH:MM" every day, "sun HH:MM" or "mon,thu HH:MM" on those days, "off" never.
# A source whose jobs are all off is not checked either. The scheduler reads this at start
# (`omw schedule list` prints it; `omw schedule systemd` renders it as timer units).
search_console = "03:00"
meta_ads_weekly = "sun 03:15"      # the 28-day reconcile; it replaces the daily re-pull on its days
meta_ads_daily = "03:15"           # the 7-day re-pull
google_ads = "04:00"
ga4 = "04:15"
stripe = "04:30"
linkedin_ads = "04:45"
twenty = "05:00"
backup = "06:00"
backup_verify = "sun 06:30"        # restore drill of the newest backup, into scratch databases

[scheduler]
# A job still running after this many minutes is stopped and reported as crashed.
timeout_minutes = 360
# A job that failed or crashed is tried again for the same slot this many times, this far apart. The failure
# hook fires when the last attempt has failed too. A failed post-sync check is never retried. 0: no retries.
retries = 2
retry_minutes = 30

[backup]
# Scheduled backups to keep; older ones are deleted after each new one.
keep = 7
