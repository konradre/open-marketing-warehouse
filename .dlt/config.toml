# Non-secret dlt configuration (committed). Secrets live in .dlt/secrets.toml (never committed).

[runtime]
# No anonymous usage pings to dltHub from pipelines or tests.
dlthub_telemetry = false
log_level = "WARNING"

[sources.search_console]
# Defaults; override in secrets.toml next to the credentials.
search_types = ["web"]
data_state = "all"

[sources.meta_ads]
levels = ["campaign"]

[sources.ga4]
days = 7

[sources.stripe]
invoice_window_days = 90

[checks.freshness_hours]
# Budget per source in hours; `omw check` fails freshness when the last successful sync is older.
search_console = 48
meta_ads = 30
google_ads = 30
ga4 = 30
stripe = 30
linkedin_ads = 30

[sources.linkedin_ads]
days = 7
