# open-marketing-warehouse — local stack.
#
#   make up                                  clickhouse + mcp-clickhouse (the agent's SQL path)
#   make chat                                + LibreChat (profile `chat`)
#   make observability                       + Langfuse (profile `observability`)
#
# Every published port is bound to 127.0.0.1. Values marked "dev default" are for a laptop; set them in
# the repo-root .env (see .env.example) for anything else. Compose is run with --env-file .env by the
# Makefile, so the defaults below only apply when no .env exists.

x-clickhouse-image: &clickhouse-image clickhouse/clickhouse-server:25.8.33.6

services:
  clickhouse:
    image: *clickhouse-image
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${OMW_ADMIN_PASSWORD:-admin-dev-password} # dev default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_SKIP_USER_SETUP: "0"
      OMW_PIPELINE_PASSWORD: ${OMW_PIPELINE_PASSWORD:-pipeline-dev-password} # dev default
      OMW_AGENT_PASSWORD: ${OMW_AGENT_PASSWORD:-agent-dev-password} # dev default
    ports:
      - "127.0.0.1:${OMW_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${OMW_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/omw.xml:/etc/clickhouse-server/config.d/omw.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ../sql:/omw/sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # The agent's SQL path (DESIGN.md §2): connected as the `agent` user, so the profile, grants and quota in
  # sql/00_*.sql are the boundary. Streamable HTTP on /mcp with a bearer token.
  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:0.7.0
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: agent
      CLICKHOUSE_PASSWORD: ${OMW_AGENT_PASSWORD:-agent-dev-password} # dev default
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "30"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${OMW_MCP_AUTH_TOKEN:-mcp-dev-token} # dev default
      CLICKHOUSE_MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,mcp-clickhouse:*"
    ports:
      - "127.0.0.1:${OMW_MCP_PORT:-8000}:8000"
    restart: unless-stopped

  # ---- profile: chat (LibreChat, off by default) ----------------------------------------------------
  librechat:
    profiles: ["chat"]
    image: ghcr.io/danny-avila/librechat:v0.8.7
    depends_on:
      librechat-mongo:
        condition: service_started
      mcp-clickhouse:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      NODE_ENV: production
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      SEARCH: "false"
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-true}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:-}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OMW_MCP_AUTH_TOKEN: ${OMW_MCP_AUTH_TOKEN:-mcp-dev-token} # dev default
      CONFIG_PATH: /app/librechat.yaml
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/api/logs
    ports:
      - "127.0.0.1:${OMW_CHAT_PORT:-3080}:3080"
    restart: unless-stopped

  librechat-mongo:
    profiles: ["chat"]
    image: mongo:8.0
    command: mongod --noauth
    volumes:
      - librechat-mongo:/data/db
    restart: unless-stopped

  # ---- profile: observability (Langfuse, off by default) ---------------------------------------------
  # Langfuse v4 needs Postgres, Redis, S3-compatible storage and its own ClickHouse. It gets a dedicated
  # ClickHouse so the warehouse stays single-tenant and the agent user never sees trace data.
  langfuse-worker:
    profiles: ["observability"]
    image: langfuse/langfuse-worker:4.75.0
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${OMW_LANGFUSE_PORT:-3000}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: "false"
    restart: unless-stopped

  langfuse-web:
    profiles: ["observability"]
    image: langfuse/langfuse:4.75.0
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      # The browser uploads media straight to MinIO, so it needs the host-published address.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${OMW_LANGFUSE_MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
    ports:
      - "127.0.0.1:${OMW_LANGFUSE_PORT:-3000}:3000"
    restart: unless-stopped

  langfuse-postgres:
    profiles: ["observability"]
    image: postgres:17.6
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-redis:
    profiles: ["observability"]
    image: redis:7.4
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:-}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    profiles: ["observability"]
    # Chainguard publishes only `latest`; pinned by digest instead (amd64/arm64 index).
    image: cgr.dev/chainguard/minio:latest@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
    volumes:
      - langfuse-minio:/data
    ports:
      - "127.0.0.1:${OMW_LANGFUSE_MINIO_PORT:-9090}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  langfuse-clickhouse:
    profiles: ["observability"]
    image: *clickhouse-image
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse-data:
  librechat-mongo:
  librechat-uploads:
  librechat-logs:
  langfuse-postgres:
  langfuse-redis:
  langfuse-minio:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
